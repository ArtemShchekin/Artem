<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Карты пользователя</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f9fc;
    margin: 20px;
  }
  button#createBtn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
  }
  button#createBtn:hover {
    background-color: #0056b3;
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0; top: 0;
    width: 100%; height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.5);
  }
  .modal-content {
    background-color: #fff;
    margin: 80px auto;
    padding: 20px 25px;
    border-radius: 8px;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  label {
    display: block;
    font-weight: 600;
    margin-top: 15px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    font-size: 14px;
    border: 1.8px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
  }
  input[type="checkbox"] {
    margin-top: 15px;
    cursor: pointer;
  }
  .input-error {
    border-color: #e74c3c !important;
  }
  .error-message {
    font-size: 12px;
    color: #e74c3c;
    margin-top: 2px;
  }
  button#saveBtn {
    margin-top: 25px;
    padding: 10px 16px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
  }
  button#saveBtn:hover {
    background-color: #0056b3;
  }
  #cardsList {
    margin-top: 30px;
    max-width: 600px;
  }
  #cardsList table {
    border-collapse: collapse;
    width: 100%;
  }
  #cardsList th, #cardsList td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }
  #cardsList th {
    background-color: #eaeaea;
  }
</style>
</head>
<body>

<button id="createBtn">Создать</button>

<div id="cardsList" aria-live="polite" aria-atomic="true"></div>

<div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h2 id="modalTitle">Карты пользователя</h2>
    <form id="cardForm" novalidate>
      <label for="cardNumber">Номер карты</label>
      <input type="text" id="cardNumber" maxlength="20" autocomplete="off" inputmode="numeric" />
      <p class="error-message" id="errorCardNumber"></p>

      <label for="instantId">ID мгновенной карты</label>
      <input type="text" id="instantId" maxlength="20" autocomplete="off" inputmode="numeric" />
      <p class="error-message" id="errorInstantId"></p>

      <label>
        <input type="checkbox" id="foreignCitizen" />
        Иностранный гражданин
      </label>

      <div id="productContainer" style="display:none;">
        <label for="productSelect">Продукт</label>
        <select id="productSelect">
          <option value="" selected hidden>-- Выберите продукт --</option>
          <option value="Дебетовая карта">Дебетовая карта</option>
          <option value="Кредитная карта">Кредитная карта</option>
        </select>
        <p class="error-message" id="errorProduct"></p>
      </div>

      <button type="submit" id="saveBtn">Сохранить</button>
    </form>
  </div>
</div>

<script>
  const createBtn = document.getElementById('createBtn');
  const modal = document.getElementById('modal');
  const cardForm = document.getElementById('cardForm');
  const cardNumberInput = document.getElementById('cardNumber');
  const instantIdInput = document.getElementById('instantId');
  const foreignCheckbox = document.getElementById('foreignCitizen');
  const productContainer = document.getElementById('productContainer');
  const productSelect = document.getElementById('productSelect');
  const errorCardNumber = document.getElementById('errorCardNumber');
  const errorInstantId = document.getElementById('errorInstantId');
  const errorProduct = document.getElementById('errorProduct');
  const cardsListDiv = document.getElementById('cardsList');

  let cards = [];
  let nextId = 1;

  createBtn.addEventListener('click', () => {
    clearForm();
    openModal();
  });

  function openModal() {
    modal.style.display = 'block';
    modal.setAttribute('aria-hidden', 'false');
    cardNumberInput.focus();
  }

  function closeModal() {
    modal.style.display = 'none';
    modal.setAttribute('aria-hidden', 'true');
  }

  // Закрытие при клике вне окна
  window.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });

  // Очищаем форму и ошибки
  function clearForm() {
    cardForm.reset();
    clearErrors();
    cardNumberInput.disabled = false;
    instantIdInput.disabled = false;
    productContainer.style.display = 'none';
  }

  function clearErrors() {
    errorCardNumber.textContent = '';
    errorInstantId.textContent = '';
    errorProduct.textContent = '';
    cardNumberInput.classList.remove('input-error');
    instantIdInput.classList.remove('input-error');
    productSelect.classList.remove('input-error');
  }

  // Разрешаем вводить только цифры
  function onlyDigits(input) {
    input.value = input.value.replace(/\D/g, '');
  }
  cardNumberInput.addEventListener('input', () => onlyDigits(cardNumberInput));
  instantIdInput.addEventListener('input', () => onlyDigits(instantIdInput));

  // При изменении чекбокса
  foreignCheckbox.addEventListener('change', () => {
    if (foreignCheckbox.checked) {
      cardNumberInput.value = '';
      instantIdInput.value = '';
      cardNumberInput.disabled = true;
      instantIdInput.disabled = true;
      productContainer.style.display = 'block';
      productSelect.value = ''; // Без предустановленного значения
      clearErrors();
    } else {
      cardNumberInput.disabled = false;
      instantIdInput.disabled = false;
      productContainer.style.display = 'none';
      productSelect.value = '';
      clearErrors();
    }
  });

  cardForm.addEventListener('submit', e => {
    e.preventDefault();
    clearErrors();

    const cardNumber = cardNumberInput.value.trim();
    const instantId = instantIdInput.value.trim();
    const foreignCitizen = foreignCheckbox.checked;
    const product = productSelect.value;

    let valid = true;

    // Валидация по чекбоксу
    if (foreignCitizen) {
      // Продукт обязателен
      if (!product) {
        valid = false;
        productSelect.classList.add('input-error');
        errorProduct.textContent = 'Поле не заполнено';
      }
    } else {
      // Номер карты обязательный и длина 10
      if (!cardNumber) {
        valid = false;
        cardNumberInput.classList.add('input-error');
        errorCardNumber.textContent = 'Поле не заполнено';
      } else if (cardNumber.length !== 10) {
        valid = false;
        cardNumberInput.classList.add('input-error');
        errorCardNumber.textContent = 'Не корректно заполнено поле';
      }
      // ID мгновенной карты обязательный и длина 12
      if (!instantId) {
        valid = false;
        instantIdInput.classList.add('input-error');
        errorInstantId.textContent = 'Поле не заполнено';
      } else if (instantId.length !== 12) {
        valid = false;
        instantIdInput.classList.add('input-error');
        errorInstantId.textContent = 'Не корректно заполнено поле';
      }
    }

    if (!valid) return;

    // Если валидация прошла — создаём карту
    cards.push({
      id: nextId++,
      cardNumber: foreignCitizen ? '' : cardNumber,
      instantId: foreignCitizen ? '' : instantId,
      foreignCitizen,
      product: foreignCitizen ? product : '',
    });

    renderCards();
    closeModal();
    clearForm();
  });

  function renderCards() {
    if (cards.length === 0) {
      cardsListDiv.innerHTML = '<p>Карты отсутствуют.</p>';
      return;
    }
    let html = '<table><thead><tr><th>ID</th><th>Номер карты</th><th>ID мгновенной карты</th><th>Иностранный гражданин</th><th>Продукт</th></tr></thead><tbody>';
    cards.forEach(c => {
      html += `<tr>
        <td>${c.id}</td>
        <td>${c.cardNumber || '-'}</td>
        <td>${c.instantId || '-'}</td>
        <td>${c.foreignCitizen ? 'Да' : 'Нет'}</td>
        <td>${c.product || '-'}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    cardsListDiv.innerHTML = html;
  }

  renderCards();
</script>

</body>
</html>
